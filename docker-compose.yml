# Local development infrastructure: MongoDB (single-node replica set), Redis, S3 (SeaweedFS).
#   pnpm infra:up      # starts everything and waits for health checks
#   pnpm infra:down
name: aptamind
services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1:27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      # Initiates the replica set on first boot (transactions require a replica set).
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. SeaweedFS (Apache-2.0) because MinIO no longer publishes
  # community images to Docker Hub. Development-only credentials (same as .env.example).
  s3:
    image: chrislusf/seaweedfs:4.47
    command:
      [
        'server',
        '-dir=/data',
        '-s3',
        '-s3.port=8333',
        '-s3.config=/etc/seaweedfs/s3.json',
        '-master.volumeSizeLimitMB=256',
        '-volume.max=0',
      ]
    ports: ['127.0.0.1:9000:8333']
    volumes: ['s3-data:/data', './infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  mongo-data:
  redis-data:
  s3-data:
